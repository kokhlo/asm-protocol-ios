name: ios

# Схема та же, что у Kosherno (kokhlo/kosher-gpt, .github/workflows/ios.yml):
# PR в main и push в main гоняют юнит-тесты; push в main после зелёных тестов
# архивирует Release и выгружает его в TestFlight. Ручной запуск (Actions → ios →
# Run workflow) выгружает только из main. Без зелёных тестов в TestFlight ничего не уходит.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR-прогоны отменяют устаревшие; прогоны main (выгрузки) не прерываются.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Юнит-тесты (iOS-симулятор)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Выбор Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Инструменты (xcodegen, xcbeautify)
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Генерация проекта (xcodegen)
        run: xcodegen generate

      - name: Проверка plist-файлов
        run: plutil -lint ci/ExportOptions.plist asm-protocol-ios/Info.plist asm-protocol-ios/PrivacyInfo.xcprivacy

      # Набор симуляторов зависит от образа раннера: берём самый свежий iPhone,
      # а не конкретную модель, которую следующий образ может убрать.
      - name: Выбор симулятора
        run: |
          simulator="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries | sort_by(.key)[]
              | select(.key | contains("SimRuntime.iOS"))
              | .value[] | select(.name | startswith("iPhone"))]
            | last | .udid // empty')"

          if [[ -z "$simulator" ]]; then
            echo '::error::На раннере нет доступного симулятора iPhone' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          echo "SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$simulator"

      - name: Юнит-тесты на симуляторе
        run: |
          set -o pipefail
          xcodebuild test \
            -project ASMProtocol.xcodeproj \
            -scheme ASMProtocol \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -only-testing:ASMProtocolTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Артефакт сборки (симулятор)
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ASMProtocol-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/ASMProtocol.app
          if-no-files-found: warn
          retention-days: 7

  testflight:
    name: Archive и выгрузка в TestFlight
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45

    env:
      # Team Ивана — та же, что у Kosherno; продублирована в ci/ExportOptions.plist.
      APPLE_TEAM_ID: 7LP48D3553
      PROJECT: ASMProtocol.xcodeproj
      SCHEME: ASMProtocol
      BUNDLE_ID: expert.softsys.asm-protocol

    steps:
      - uses: actions/checkout@v7

      - name: Выбор Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Проверка секретов
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          required=(
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64
          )
          missing=()

          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            for variable in "${missing[@]}"; do
              echo "::error::Нет секрета $variable (Settings → Secrets and variables → Actions; см. README, раздел TestFlight)"
            done
            exit 1
          fi

      - name: Инструменты (xcodegen, xcbeautify)
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Генерация проекта (xcodegen)
        run: xcodegen generate

      - name: Ключ App Store Connect API
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          key_directory="$RUNNER_TEMP/appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          install -d -m 700 "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Номера билдов начинаются с 200000, как у Kosherno.
      #
      # Архив не подписывается: подпись здесь потребовала бы Apple Development-сертификат,
      # а у чистого раннера нет приватного ключа, и каждый прогон создавал бы новый
      # сертификат до лимита Apple. Экспорт ниже подписывает приложение облачным
      # Apple Distribution-сертификатом команды (без локального ключа и без лимита).
      - name: Archive (Release)
        run: |
          set -o pipefail
          build_number="$((200000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ASMProtocol.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$build_number" | xcbeautify

      # Номер билда должен дойти до Info.plist приложения, иначе вторая выгрузка
      # отвергается как дубликат (ITMS-90189).
      - name: Проверка версии в архиве
        run: |
          plist="$RUNNER_TEMP/ASMProtocol.xcarchive/Products/Applications/ASMProtocol.app/Info.plist"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          build="$(plutil -extract CFBundleVersion raw "$plist")"
          echo "bundle=$bundle_id version=$version build=$build"
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"

          if [[ "$build" != "$BUILD_NUMBER" ]]; then
            echo "::error::CFBundleVersion в архиве '$build', ожидался '$BUILD_NUMBER'"
            exit 1
          fi
          if [[ "$bundle_id" != "$BUNDLE_ID" ]]; then
            echo "::error::CFBundleIdentifier в архиве '$bundle_id', ожидался '$BUNDLE_ID'"
            exit 1
          fi

      - name: Выгрузка в TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ASMProtocol.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlightExport" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" | xcbeautify

      - name: Итог
        if: success()
        run: |
          {
            echo '### Билд принят App Store Connect'
            echo
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Версия: \`$MARKETING_VERSION\`, билд: \`$BUILD_NUMBER\`"
            echo "- Коммит: \`$GITHUB_SHA\`"
            echo
            echo 'Билд появится в TestFlight после обработки в App Store Connect (обычно несколько минут).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Удаление ключа
        if: always()
        run: rm -rf "$RUNNER_TEMP/appstoreconnect"
