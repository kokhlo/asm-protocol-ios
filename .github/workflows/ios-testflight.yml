name: iOS TestFlight

on:
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  test:
    name: Simulator tests (gate for upload)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Generate Xcode project (xcodegen)
        run: brew install xcodegen && xcodegen generate

      - name: Run tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ASMProtocol.xcodeproj \
            -scheme ASMProtocol \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

  build-upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Generate Xcode project (xcodegen)
        run: brew install xcodegen && xcodegen generate

      - name: Write ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-keys" && chmod 700 "$RUNNER_TEMP/asc-keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Archive (Release, device, auto signing)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ASMProtocol.xcodeproj \
            -scheme ASMProtocol \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc-keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | xcbeautify

      - name: Export IPA (App Store Connect)
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc-keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | xcbeautify

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ipa/ASMProtocol.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}

      - name: Cleanup key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-keys"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: build/
          if-no-files-found: warn
